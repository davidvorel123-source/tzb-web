<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PĹ™ehled designovĂ˝ch variant â€” TZB Projekce</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; color: #fff; margin: 0; overflow: hidden; }
        
        .switcher-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(10,10,10,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 0 1.5rem;
            z-index: 9999;
            display: flex; align-items: center; gap: 1rem;
            overflow-x: auto;
        }
        .switcher-bar h2 {
            font-size: 0.85rem; font-weight: 600;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-right: 0.5rem;
            white-space: nowrap;
        }
        .theme-btn {
            padding: 0.45rem 0.8rem;
            border: 1.5px solid rgba(255,255,255,0.15);
            background: transparent;
            color: rgba(255,255,255,0.7);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 0.5rem;
            white-space: nowrap;
        }
        .theme-btn:hover { border-color: rgba(255,255,255,0.3); color: #fff; background: rgba(255,255,255,0.05); }
        .theme-btn.active { border-color: #14b8a6; color: #14b8a6; background: rgba(20, 184, 166, 0.1); }
        .theme-btn .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        
        .preview-frame {
            position: absolute; top: 60px; bottom: 50px; left: 0; right: 0;
            width: 100%; height: calc(100vh - 110px);
            border: none;
            background: #fff;
        }

        .page-links {
            position: fixed; bottom: 0; left: 0; right: 0; height: 50px;
            background: rgba(10,10,10,0.95);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 0 1.5rem;
            z-index: 9999;
            display: flex; align-items: center; gap: 0.5rem;
            overflow-x: auto;
        }
        .page-links span {
            font-size: 0.78rem; color: rgba(255,255,255,0.4);
            margin-right: 0.25rem; text-transform: uppercase;
            letter-spacing: 0.06em; font-weight: 600;
        }
        .page-link {
            padding: 0.35rem 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: rgba(255,255,255,0.6);
            border-radius: 6px; cursor: pointer;
            font-family: inherit; font-size: 0.78rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .page-link:hover { border-color: rgba(255,255,255,0.25); color: #fff; }
        .page-link.active { border-color: #14b8a6; color: #14b8a6; }
    </style>
</head>
<body>
    <div class="switcher-bar">
        <h2>TĂ©ma:</h2>
        <button class="theme-btn active" data-theme="theme-dark-tech">
            <span class="dot" style="background: #14b8a6;"></span> Dark Tech
        </button>
        <button class="theme-btn" data-theme="theme-warm-studio">
            <span class="dot" style="background: #ea580c;"></span> Warm Studio
        </button>
        <button class="theme-btn" data-theme="theme-clean-blue">
            <span class="dot" style="background: #3b82f6;"></span> Clean Blue
        </button>
        <button class="theme-btn" data-theme="theme-nordic-minimal">
            <span class="dot" style="background: #22c55e;"></span> Nordic Minimal
        </button>
        <button class="theme-btn" data-theme="theme-premium-dark">
            <span class="dot" style="background: #f59e0b;"></span> Premium Dark
        </button>
    </div>

    <!-- PĹ™ebĂ­rĂˇme tĂ©ma bezpeÄŤnÄ› pĹ™es URL parametry, coĹľ funguje i lokĂˇlnÄ› -->
    <iframe id="preview" class="preview-frame" src="uvod.html?theme=theme-dark-tech"></iframe>

    <div class="page-links">
        <span>StrĂˇnka:</span>
        <button class="page-link active" data-page="uvod.html">Ăšvod</button>
        <button class="page-link" data-page="sluzby.html">SluĹľby</button>
        <button class="page-link" data-page="reference.html">Reference</button>
        <button class="page-link" data-page="o-nas.html">O nĂˇs</button>
        <button class="page-link" data-page="poptavka.html">PoptĂˇvka</button>
        <button class="page-link" data-page="kontakt.html">Kontakt</button>
    </div>

    <script>
        let currentTheme = 'theme-dark-tech';
        let currentPage = 'uvod.html';

        function loadFrame() {
            const iframe = document.getElementById('preview');
            // ZmÄ›nĂ­ zdroj iframu s pĹ™edanĂ˝m parametrem tĂ©matu (CORS-bezpeÄŤnĂ© Ĺ™eĹˇenĂ­)
            iframe.src = currentPage + '?theme=' + currentTheme;
        }

        // TlaÄŤĂ­tka tĂ©mat
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTheme = btn.dataset.theme;
                loadFrame();
            });
        });

        // TlaÄŤĂ­tka strĂˇnek
        document.querySelectorAll('.page-link').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.page-link').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPage = btn.dataset.page;
                loadFrame();
            });
        });
    </script>
</body>
</html>
